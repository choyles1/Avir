    <div class="tabs">
        <button class="tab active" onclick="switchTab('schedule')">Schedule View</button>
        <button class="tab" onclick="switchTab('add-event')">Add Event</button>
        <button class="tab" onclick="switchTab('patients')">Manage Patients</button>
    </div>

    <div class="content">
        <!-- Schedule View -->
        <div id="schedule-view" class="view active">
            <div id="schedule-container"></div>
        </div>

        <!-- Add Event View -->
        <div id="add-event-view" class="view">
            <h2 style="margin-bottom: 20px;">Add New Event</h2>
            <form id="event-form">
                <div class="form-group">
                    <label for="event-patient">Patient</label>
                    <select id="event-patient" required>
                        <option value="">Select a patient...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="event-time">Time</label>
                    <input type="time" id="event-time" required>
                </div>
                <div class="form-group">
                    <label for="event-description">Event Description</label>
                    <textarea id="event-description" required placeholder="e.g., Administer medication, Vital signs check, Physical therapy..."></textarea>
                </div>
                <button type="submit" class="btn">Add Event</button>
            </form>
        </div>

        <!-- Patients View -->
        <div id="patients-view" class="view">
            <h2 style="margin-bottom: 20px;">Manage Patients</h2>
            <form id="patient-form" style="margin-bottom: 30px;">
                <div class="form-group">
                    <label for="patient-name">Patient Name</label>
                    <input type="text" id="patient-name" required placeholder="Enter patient name">
                </div>
                <div class="form-group">
                    <label for="patient-room">Room Number</label>
                    <input type="text" id="patient-room" required placeholder="e.g., 44A, 34B">
                </div>
                <button type="submit" class="btn">Add Patient</button>
            </form>
            <h3 style="margin-bottom: 15px;">Current Patients</h3>
            <div id="patient-list"></div>
        </div>
    </div>
</div>

<script>
    // Data storage
    var patients = [];
    var events = [];

    // Initialize app
    function init() {
        loadData();
        updatePatientSelect();
        updatePatientList();
        renderSchedule();
    }

    function loadData() {
        var patientsData = localStorage.getItem('patients');
        var eventsData = localStorage.getItem('events');
        
        patients = patientsData ? JSON.parse(patientsData) : [];
        events = eventsData ? JSON.parse(eventsData) : [];
    }

    function saveData() {
        localStorage.setItem('patients', JSON.stringify(patients));
        localStorage.setItem('events', JSON.stringify(events));
    }

    // Tab switching
    function switchTab(tabName) {
        var tabs = document.querySelectorAll('.tab');
        var views = document.querySelectorAll('.view');
        
        for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.remove('active');
        }
        for (var j = 0; j < views.length; j++) {
            views[j].classList.remove('active');
        }
        
        event.target.classList.add('active');
        document.getElementById(tabName + '-view').classList.add('active');
        
        if (tabName === 'schedule') {
            renderSchedule();
        }
    }

    // Patient management
    document.getElementById('patient-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var name = document.getElementById('patient-name').value.trim();
        var room = document.getElementById('patient-room').value.trim();
        
        if (name && room) {
            var patient = {
                id: Date.now().toString(),
                name: name,
                room: room
            };
            patients.push(patient);
            saveData();
            document.getElementById('patient-name').value = '';
            document.getElementById('patient-room').value = '';
            updatePatientSelect();
            updatePatientList();
            alert('Patient added successfully!');
        }
    });

    function updatePatientSelect() {
        var select = document.getElementById('event-patient');
        select.innerHTML = '<option value="">Select a patient...</option>';
        
        for (var i = 0; i < patients.length; i++) {
            var option = document.createElement('option');
            option.value = patients[i].id;
            option.textContent = patients[i].name;
            select.appendChild(option);
        }
    }

    function updatePatientList() {
        var container = document.getElementById('patient-list');
        
        if (patients.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👤</div><p>No patients added yet</p></div>';
            return;
        }
        
        container.innerHTML = '';
        var listDiv = document.createElement('div');
        listDiv.className = 'patient-list';
        
        for (var i = 0; i < patients.length; i++) {
            var patient = patients[i];
            var itemDiv = document.createElement('div');
            itemDiv.className = 'patient-list-item';
            
            var nameSpan = document.createElement('span');
            nameSpan.textContent = patient.name + ' - Room ' + patient.room;
            nameSpan.style.fontWeight = '600';
            
            var deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn btn-small btn-danger';
            deleteBtn.textContent = 'Delete';
            deleteBtn.onclick = (function(patientId) {
                return function() {
                    deletePatient(patientId);
                };
            })(patient.id);
            
            itemDiv.appendChild(nameSpan);
            itemDiv.appendChild(deleteBtn);
            listDiv.appendChild(itemDiv);
        }
        
        container.appendChild(listDiv);
    }

    function deletePatient(patientId) {
        if (confirm('Are you sure you want to delete this patient? All associated events will also be deleted.')) {
            patients = patients.filter(function(p) { return p.id !== patientId; });
            events = events.filter(function(e) { return e.patientId !== patientId; });
            saveData();
            updatePatientSelect();
            updatePatientList();
            renderSchedule();
        }
    }

    // Event management
    document.getElementById('event-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        var patientId = document.getElementById('event-patient').value;
        var time = document.getElementById('event-time').value;
        var description = document.getElementById('event-description').value.trim();
        
        if (patientId && time && description) {
            var newEvent = {
                id: Date.now().toString(),
                patientId: patientId,
                time: time,
                description: description,
                completed: false
            };
            
            events.push(newEvent);
            saveData();
            
            document.getElementById('event-description').value = '';
            
            alert('Event added successfully!');
        }
    });

    function toggleEventComplete(eventId) {
        for (var i = 0; i < events.length; i++) {
            if (events[i].id === eventId) {
                events[i].completed = !events[i].completed;
                break;
            }
        }
        saveData();
        renderSchedule();
    }

    function deleteEvent(eventId) {
        if (confirm('Are you sure you want to delete this event?')) {
            events = events.filter(function(e) { return e.id !== eventId; });
            saveData();
            renderSchedule();
        }
    }

    // Render schedule
    function renderSchedule() {
        var container = document.getElementById('schedule-container');
        
        if (patients.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👤</div><p>No patients added yet. Go to "Manage Patients" to add patients.</p></div>';
            return;
        }
        
        if (events.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📅</div><p>No events scheduled. Go to "Add Event" to schedule patient care tasks.</p></div>';
            return;
        }
        
        container.innerHTML = '';
        
        // Group events by patient
        var eventsByPatient = {};
        for (var i = 0; i < events.length; i++) {
            var evt = events[i];
            if (!eventsByPatient[evt.patientId]) {
                eventsByPatient[evt.patientId] = [];
            }
            eventsByPatient[evt.patientId].push(evt);
        }
        
        // Sort events within each patient by time only
        for (var patientId in eventsByPatient) {
            eventsByPatient[patientId].sort(function(a, b) {
                return a.time.localeCompare(b.time);
            });
        }
        
        // Render each patient's events
        for (var j = 0; j < patients.length; j++) {
            var patient = patients[j];
            var patientEvents = eventsByPatient[patient.id] || [];
            
            if (patientEvents.length === 0) continue;
            
            var patientCard = document.createElement('div');
            patientCard.className = 'patient-card';
            
            var headerDiv = document.createElement('div');
            headerDiv.className = 'patient-header';
            
            var nameDiv = document.createElement('div');
            nameDiv.className = 'patient-name';
            nameDiv.textContent = patient.name + ' - Room ' + patient.room;
            
            headerDiv.appendChild(nameDiv);
            patientCard.appendChild(headerDiv);
            
            var eventListDiv = document.createElement('div');
            eventListDiv.className = 'event-list';
            
            for (var k = 0; k < patientEvents.length; k++) {
                var evt = patientEvents[k];
                var eventItem = document.createElement('div');
                eventItem.className = 'event-item';
                if (evt.completed) {
                    eventItem.classList.add('completed');
                }
                
                var timeDiv = document.createElement('div');
                timeDiv.className = 'event-time';
                timeDiv.textContent = formatTime(evt.time);
                
                var detailsDiv = document.createElement('div');
                detailsDiv.className = 'event-details';
                
                var descDiv = document.createElement('div');
                descDiv.className = 'event-description';
                descDiv.textContent = evt.description;
                
                detailsDiv.appendChild(descDiv);
                
                var actionsDiv = document.createElement('div');
                actionsDiv.className = 'event-actions';
                
                var checkboxContainer = document.createElement('div');
                checkboxContainer.className = 'checkbox-container';
                
                var checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = evt.completed;
                checkbox.onchange = (function(eventId) {
                    return function() {
                        toggleEventComplete(eventId);
                    };
                })(evt.id);
                
                checkboxContainer.appendChild(checkbox);
                
                var deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-small btn-danger';
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = (function(eventId) {
                    return function() {
                        deleteEvent(eventId);
                    };
                })(evt.id);
                
                actionsDiv.appendChild(checkboxContainer);
                actionsDiv.appendChild(deleteBtn);
                
                eventItem.appendChild(timeDiv);
                eventItem.appendChild(detailsDiv);
                eventItem.appendChild(actionsDiv);
                
                eventListDiv.appendChild(eventItem);
            }
            
            patientCard.appendChild(eventListDiv);
            container.appendChild(patientCard);
        }
    }

    function formatTime(timeStr) {
        var parts = timeStr.split(':');
        var hours = parseInt(parts[0]);
        var minutes = parts[1];
        var ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return hours + ':' + minutes + ' ' + ampm;
    }

    // Initialize on page load
    init();
</script>
